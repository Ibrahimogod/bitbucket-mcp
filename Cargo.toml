[package]
name = "bitbucket-mcp"
version = "1.0.0"
edition = "2024"
description = "A Model Context Protocol (MCP) server for Bitbucket Cloud REST API."
license = "MIT"
repository = "https://github.com/ibrahimogod/bitbucket-mcp"
authors = ["Ibrahim Ahmed Badr"]
keywords = ["mcp", "bitbucket", "ai", "llm", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bitbucket_stdio"
path = "src/bitbucket_stdio.rs"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-io"]}
anyhow = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
mockito = "1"
